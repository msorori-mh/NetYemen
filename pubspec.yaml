name: netyemen
description: WASEL NET — واصل نت، منصة بيع كروت الإنترنت للشبكات المحلية في اليمن

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Official Flutter localization (required for Arabic RTL Material widgets)
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  app_links: ^6.1.1

  # State Management
  flutter_riverpod: ^2.5.0

  # UI Utilities
  flutter_screenutil: ^5.9.0

  # Icons
  cupertino_icons: ^1.0.6

  # Wi-Fi discovery (Android only; iOS stub)
  wifi_scan: ^0.4.1+2
  unorm_dart: ^0.3.2

  # Android notification permission UX (no push-provider SDK / secrets)
  permission_handler: ^11.3.1

  # Public privacy and account-deletion links required by store policy
  url_launcher: ^6.3.2

  # Push notifications (FCM token registration only; no server secrets)
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # PIN device-trust flag (per-user local storage)
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 21
