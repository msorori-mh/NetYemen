name: netyemen
description: NetYemen — منصة بيع كروت الإنترنت للشبكات المحلية في اليمن

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.0

  # UI Utilities
  flutter_screenutil: ^5.9.0

  # Icons
  cupertino_icons: ^1.0.6

  # Wi-Fi discovery (Android only; iOS stub)
  wifi_scan: ^0.4.1+2
  unorm_dart: ^0.3.2

  # Android notification permission UX (no push-provider SDK / secrets)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
