name: netyemen
description: NetYemen — منصة بيع كروت الإنترنت للشبكات المحلية في اليمن

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.0

  # UI Utilities
  flutter_screenutil: ^5.9.0

  # Icons
  cupertino_icons: ^1.0.6

  # Client-generated idempotency keys for purchase_card / deposit requests (BR-PURCHASE-002)
  uuid: ^4.4.0

  # Deposit receipt photo capture (BR-WALLET-003)
  image_picker: ^1.1.2

  # User-triggered nearby Wi-Fi scan (BR-NETWORK-011) — Android only, matches V1 scope
  wifi_scan: ^0.4.1

  # Runtime permission requests for the Wi-Fi scan (Android requires location
  # permission to read scan results)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
