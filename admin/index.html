<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>واصل نت — لوحة الإدارة</title>
  <link rel="stylesheet" href="./styles.css?v=20260914b">
</head>
<body>

<div id="login">
  <div class="card login-card">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <h2>واصل نت</h2>
      <p>بوابة إدارة المنصة</p>
    </div>
    
    <div id="step-google">
      <button class="btn btn-primary w-full mt-4" id="google-signin">تسجيل الدخول عبر Google</button>
      <p class="login-hint mt-2">يجب أن يملك الحساب صلاحية إدارة المنصة</p>
    </div>
  </div>
</div>

<div id="pin-gate">
  <div class="card login-card">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <h2 id="pin-gate-title">رمز الحماية</h2>
      <p id="pin-gate-sub"></p>
    </div>

    <div id="pin-setup-step" style="display:none">
      <label for="pin-setup-1">أدخل رمزاً من 6 أرقام</label>
      <input id="pin-setup-1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" dir="ltr" class="text-center tracking-widest text-lg mb-2">
      <label for="pin-setup-2">تأكيد الرمز</label>
      <input id="pin-setup-2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" dir="ltr" class="text-center tracking-widest text-lg mb-4">
      <button class="btn btn-primary w-full" id="pin-setup-submit">حفظ الرمز</button>
      <p id="pin-setup-err" class="text-error mt-2" style="display:none"></p>
    </div>

    <div id="pin-entry-step" style="display:none">
      <label for="pin-entry-code">أدخل رمز الحماية</label>
      <input id="pin-entry-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" dir="ltr" class="text-center tracking-widest text-lg mb-4">
      <button class="btn btn-primary w-full" id="pin-entry-submit">دخول</button>
      <p id="pin-entry-err" class="text-error mt-2" style="display:none"></p>
      <button class="btn btn-ghost w-full mt-2" id="pin-forgot">نسيت الرمز؟</button>
    </div>
  </div>
</div>

<div id="shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
        <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <h1>واصل نت</h1>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-group">عام</div>
      <a href="#dashboard" data-view="dashboard">لوحة القيادة</a>
      <a href="#networks" data-view="networks">الشبكات</a>
      <a href="#ssid" data-view="ssid">توثيق المعرفات (SSID)</a>
      <a href="#packages" data-view="packages">الباقات</a>
      <a href="#users" data-view="users">المستخدمون والأدوار</a>
      
      <div class="nav-group">المالية</div>
      <a href="#destinations" data-view="destinations">وجهات الدفع</a>
      <a href="#deposits" data-view="deposits">طلبات الشحن</a>
      <a href="#settlements" data-view="settlements">تصفية المستحقات</a>
      <a href="#commission" data-view="commission">إعدادات العمولة</a>
      
      <div class="nav-group">العمليات</div>
      <a href="#cards" data-view="cards">خزنة الكروت</a>
      <a href="#notifications" data-view="notifications">الإشعارات</a>
    </nav>
    <div class="sidebar-footer">
      <div id="whoami" class="user-info"></div>
      <button class="btn btn-ghost w-full" id="logout">تسجيل الخروج</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <h2 id="page-title">لوحة القيادة</h2>
      <button class="menu-toggle btn btn-icon" id="menu-toggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
    <div id="view" class="view-container"></div>
  </main>
</div>

<!-- Custom Modal Overlay -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3 id="modal-title">تأكيد</h3>
      <button class="btn btn-icon btn-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Non-blocking Toasts -->
<div id="toast-container" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js?v=20260914b"></script>
<script src="./app.js?v=20260914b"></script>

</body>
</html>
