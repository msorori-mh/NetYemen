services:
  freeradius:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Supply an immutable reference for real deployments, for example
        # freeradius/freeradius-server@sha256:<digest verified by the operator>.
        FREERADIUS_IMAGE: ${WASEL_FREERADIUS_IMAGE:-freeradius/freeradius-server:3.2.7}
    environment:
      WASEL_CONTROL_URL: ${WASEL_CONTROL_URL:?set WASEL_CONTROL_URL}
      WASEL_RADIUS_INTERNAL_KEY: ${WASEL_RADIUS_INTERNAL_KEY:?set WASEL_RADIUS_INTERNAL_KEY}
      WASEL_RADIUS_SHARED_SECRET: ${WASEL_RADIUS_SHARED_SECRET:?set WASEL_RADIUS_SHARED_SECRET}
      WASEL_NAS_NETWORK: ${WASEL_NAS_NETWORK:?set WASEL_NAS_NETWORK}
    # SECURITY: Docker-published ports are reached through DNAT + FORWARD and
    # therefore BYPASS host ufw/INPUT rules. On any host with a public address
    # the DOCKER-USER restriction from staging/cloud-init.yaml.template
    # (wasel-radius-firewall.service) must be active, and staging/preflight.sh
    # must pass, before this stack is started. WASEL_RADIUS_BIND_IP optionally
    # narrows the listening host address (for example a WireGuard interface).
    ports:
      - "${WASEL_RADIUS_BIND_IP:-0.0.0.0}:1812:1812/udp"
      - "${WASEL_RADIUS_BIND_IP:-0.0.0.0}:1813:1813/udp"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    extra_hosts:
      - "host.docker.internal:host-gateway"
