# NAS identity is bound to the RADIUS client, not to the self-asserted
# NAS-Identifier attribute. Each router gets its own client block whose
# shortname equals that router's NAS-Identifier (RouterOS: /system identity).
# The wasel site rejects any request whose NAS-Identifier differs from the
# matched client's shortname, and radius-control re-checks the binding.
# To add a router, copy this block with its own /32 ipaddr and shortname.
client wasel_partner_nas {
    ipaddr = $ENV{WASEL_NAS_NETWORK}
    shortname = $ENV{WASEL_NAS_IDENTIFIER}
    secret = $ENV{WASEL_RADIUS_SHARED_SECRET}
    require_message_authenticator = yes
    nas_type = other
}
