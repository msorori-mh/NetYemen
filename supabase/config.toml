# NetYemen Local Supabase Configuration
# NY-GOV-BE-001 / NY-GOV-BE-001C Foundation Configuration

project_id = "netyemen-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[realtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
