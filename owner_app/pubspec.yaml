name: owner
description: NetYemen Owner — تطبيق أصحاب الشبكات لإدارة شبكاتهم ومخزون الكروت ومبيعاتهم

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (RTL + الترجمات العربية لعناصر Material)
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.5.0

  # UI Utilities
  flutter_screenutil: ^5.9.0

  # Icons
  cupertino_icons: ^1.0.6

  # Supabase deep link explicit handling
  app_links: ^7.0.0

  # Idempotency keys
  uuid: ^4.4.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
