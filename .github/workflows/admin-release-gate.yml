name: WASEL NET Admin Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-release-gate
  cancel-in-progress: false

jobs:
  preflight:
    name: Admin Production Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: admin-production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ADMIN_PASSWORD_RECOVERY_REDIRECT_URL: ${{ vars.ADMIN_PASSWORD_RECOVERY_REDIRECT_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Release Configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            SUPABASE_DB_PASSWORD \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            ADMIN_PASSWORD_RECOVERY_REDIRECT_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required admin release configuration is missing: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Locked Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dependency Lock Stability
        run: git diff --exit-code -- pubspec.lock

      - name: Verify Formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze Static Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Link Supabase Project for Read-Only Preflight
        run: |
          npx --yes supabase@2.115.0 link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Verify Remote Migration History
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/admin-release-evidence
          npx --yes supabase@2.115.0 migration list --linked \
            2>&1 | tee build/admin-release-evidence/migration-list.txt

      - name: Lint Linked Database
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db lint --linked --level error \
            2>&1 | tee build/admin-release-evidence/db-lint.txt

      - name: Verify Migration Apply Plan
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db push --linked --dry-run \
            2>&1 | tee build/admin-release-evidence/db-push-dry-run.txt

      - name: Build Admin Web Release
        run: |
          flutter build web --release --target lib/admin_main.dart \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=ADMIN_PASSWORD_RECOVERY_REDIRECT_URL="$ADMIN_PASSWORD_RECOVERY_REDIRECT_URL"

      - name: Upload Admin Release Candidate
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-release-candidate
          path: build/web
          if-no-files-found: error

      - name: Upload Release Preflight Evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-preflight-evidence
          path: build/admin-release-evidence
          if-no-files-found: error
