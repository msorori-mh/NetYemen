name: WASEL NET Admin Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-release-gate
  cancel-in-progress: false

jobs:
  preflight:
    name: Admin Production Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: admin-production

    # Job-level env holds PUBLIC configuration only. The Supabase access token
    # and the database password are passed only to the steps that call the
    # Supabase CLI. The admin console is the static app in admin/ (no build
    # step, no third-party packages); this gate verifies it and packages it.
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ADMIN_PUBLIC_ORIGIN: ${{ vars.ADMIN_PUBLIC_ORIGIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Required Release Configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_PROJECT_REF \
            SUPABASE_DB_PASSWORD \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            ADMIN_PUBLIC_ORIGIN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required admin release configuration is missing: $name"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify Static Admin Console
        run: |
          set -euo pipefail
          node --check admin/app.js
          node scripts/test_admin_console_contract.mjs

      - name: Link Supabase Project for Read-Only Preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase@2.115.0 link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Verify Remote Migration History
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/admin-release-evidence
          npx --yes supabase@2.115.0 migration list --linked \
            2>&1 | tee build/admin-release-evidence/migration-list.txt

      - name: Lint Linked Database
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db lint --linked --level error \
            2>&1 | tee build/admin-release-evidence/db-lint.txt

      - name: Verify Migration Apply Plan
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.115.0 db push --linked --dry-run \
            2>&1 | tee build/admin-release-evidence/db-push-dry-run.txt

      - name: Assemble Static Admin Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web
          cp admin/index.html admin/app.js admin/styles.css admin/vercel.json build/web/
          # config.js carries PUBLIC values only (project URL + publishable key).
          node -e '
            const fs = require("fs");
            const cfg = { url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_PUBLISHABLE_KEY };
            fs.writeFileSync("build/web/config.js", "window.NETYEMEN_CONFIG = " + JSON.stringify(cfg, null, 2) + ";\n");
          '
          node --check build/web/config.js

      - name: Generate Public Legal Pages
        run: |
          node scripts/verify_waselnet_public_legal_host.mjs --self-test
          node scripts/configure_waselnet_public_legal_pages.mjs build/web/legal

      - name: Verify Public Legal Artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/legal/privacy.html
          test -s build/web/legal/delete-account.html
          test -s build/web/legal/delete-account.js
          ! grep -R '{{[A-Z0-9_]\+}}' build/web/legal
          grep -F 'سياسة خصوصية واصل نت' build/web/legal/privacy.html
          grep -F 'request_my_account_deletion' build/web/legal/delete-account.js

      - name: Upload Admin Release Candidate
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-release-candidate
          path: build/web
          if-no-files-found: error

      - name: Upload Release Preflight Evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-release-preflight-evidence
          path: build/admin-release-evidence
          if-no-files-found: error
