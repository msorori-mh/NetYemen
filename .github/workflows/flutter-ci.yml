name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Locked Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dependency Lock Stability
        run: git diff --exit-code -- pubspec.lock

      - name: Verify Formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze Static Code
        run: flutter analyze

      - name: Scan Release Readiness Guards
        shell: pwsh
        run: ./scripts/scan_waselnet_release_readiness.ps1

      - name: Run Tests
        run: timeout 4m flutter test --timeout 2m --reporter expanded

      - name: Create Ephemeral CI Upload Key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass ci-only-password \
            -alias waselnet-ci \
            -keypass ci-only-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=WASEL NET CI, OU=TEST ONLY, O=SysTrac, C=YE"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload-keystore.jks
          storePassword=ci-only-password
          keyAlias=waselnet-ci
          keyPassword=ci-only-password
          EOF

      - name: Build Android Release Readiness Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-publishable-key \
            --dart-define=PRIVACY_POLICY_URL=https://example.com/privacy \
            --dart-define=ACCOUNT_DELETION_URL=https://example.com/delete-account

      - name: Remove Ephemeral CI Upload Key
        if: always()
        run: |
          rm -f android/key.properties android/ci-upload-keystore.jks

      - name: Build Admin Web Console
        run: flutter build web --target lib/admin_main.dart

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-console
          path: build/web
          if-no-files-found: error
