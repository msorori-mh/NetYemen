name: Flutter CI

on:
  push:
    branches:
      - main
      - codex/NY-V1-CUSTOMER-PRODUCT-HARDENING-001
      - codex/WASEL-ONE-APK-PILOT-001
  pull_request:
    branches:
      - main
      - codex/WASEL-ONE-APK-PILOT-001

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Locked Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dependency Lock Stability
        run: git diff --exit-code -- pubspec.lock

      - name: Verify Formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze Static Code
        run: flutter analyze lib test

      - name: Scan Release Readiness Guards
        shell: pwsh
        run: ./scripts/scan_waselnet_release_readiness.ps1

      - name: Verify Public Legal Artifact Generator
        env:
          ADMIN_PUBLIC_ORIGIN: https://admin.example.com
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
        run: |
          set -euo pipefail
          node --check scripts/configure_waselnet_public_legal_pages.mjs
          node --check scripts/verify_waselnet_public_legal_host.mjs
          node scripts/verify_waselnet_public_legal_host.mjs --self-test
          node scripts/configure_waselnet_public_legal_pages.mjs build/ci-public-legal
          test -s build/ci-public-legal/privacy.html
          test -s build/ci-public-legal/delete-account.html
          test -s build/ci-public-legal/delete-account.js
          node --check build/ci-public-legal/delete-account.js
          ! grep -R '{{[A-Z0-9_]\+}}' build/ci-public-legal
          grep -F 'request_my_account_deletion' build/ci-public-legal/delete-account.js

      # The static admin console (admin/) has no build step: check that it
      # parses and that every RPC it calls exists in the migrations with the
      # parameters it sends.
      - name: Verify Static Admin Console
        run: |
          set -euo pipefail
          node --check admin/app.js
          node scripts/test_admin_console_contract.mjs

      - name: Run Tests
        run: timeout 4m flutter test --timeout 2m --reporter expanded

      # Built WITHOUT --dart-define: there is no SUPABASE_URL, so this APK runs
      # entirely on built-in demo data and cannot reach any backend. It proves
      # that the debug build compiles; it is NOT a pilot or release build.
      - name: Build Demo-Data Debug APK (no backend)
        run: flutter build apk --debug

      - name: Upload Demo-Data Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEL-NET-DEMO-DEBUG-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Ephemeral CI Upload Key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass ci-only-password \
            -alias waselnet-ci \
            -keypass ci-only-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=WASEL NET CI, OU=TEST ONLY, O=SysTrac, C=YE"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload-keystore.jks
          storePassword=ci-only-password
          keyAlias=waselnet-ci
          keyPassword=ci-only-password
          EOF

      - name: Build Android Release Readiness Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-publishable-key \
            --dart-define=PRIVACY_POLICY_URL=https://example.com/privacy \
            --dart-define=ACCOUNT_DELETION_URL=https://example.com/delete-account

      - name: Remove Ephemeral CI Upload Key
        if: always()
        run: |
          rm -f android/key.properties android/ci-upload-keystore.jks
