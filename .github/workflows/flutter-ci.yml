name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Locked Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify Dependency Lock Stability
        run: git diff --exit-code -- pubspec.lock

      - name: Verify Formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze Static Code
        run: flutter analyze

      - name: Run Tests
        run: timeout 4m flutter test --timeout 2m --reporter expanded

      - name: Build Admin Web Console
        run: flutter build web --target lib/admin_main.dart

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-console
          path: build/web
          if-no-files-found: error
