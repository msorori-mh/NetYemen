# TEMPORARY: remove before merge. The authoring session cannot read Actions
# logs, so this posts tool output as a commit comment and commits formatter
# output back to the working branch.
name: ZZ Temporary Claude Feedback

on:
  push:
    branches:
      - feat/pin-dualcontrol-whatsapp-otp

permissions:
  contents: write

concurrency:
  group: zz-claude-feedback
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true
      - name: Main app
        run: |
          {
            echo "## main: pub get"; flutter pub get --enforce-lockfile 2>&1 | tail -5
            echo "## main: format"; dart format lib test 2>&1 | grep -v "^Unchanged" | tail -60
            echo "## main: analyze"; flutter analyze lib test 2>&1 | tail -150
            echo "## main: test"; flutter test --reporter failures-only 2>&1 | tail -250
          } > /tmp/main.txt || true
      - name: Owner app
        working-directory: owner_app
        run: |
          {
            echo "## owner: pub get"; flutter pub get --enforce-lockfile 2>&1 | tail -5
            echo "## owner: format"; dart format lib test 2>&1 | grep -v "^Unchanged" | tail -60
            echo "## owner: analyze"; flutter analyze lib test 2>&1 | tail -120
            echo "## owner: test"; flutter test --reporter failures-only 2>&1 | tail -150
          } > /tmp/owner.txt || true
      - name: Commit formatter output
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add lib test owner_app/lib owner_app/test
          if ! git diff --cached --quiet; then
            git commit -m "style: apply dart format (CI formatter output)"
            git push
            echo "FORMAT COMMIT PUSHED: $(git rev-parse HEAD)" >> /tmp/main.txt
          fi
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in /tmp/main.txt /tmp/owner.txt; do
            [ -f "$f" ] || continue
            head -c 60000 "$f" > /tmp/body.txt
            jq -Rs '{body: ("```\n" + . + "\n```")}' /tmp/body.txt > /tmp/payload.json
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/payload.json > /dev/null
          done

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno and PowerShell
        shell: bash
        run: |
          {
            echo "## SRI supabase-js@2.45.4 (jsDelivr)"
            curl -sSf https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js -o /tmp/sb.js && \
              echo "sha384-$(openssl dgst -sha384 -binary /tmp/sb.js | openssl base64 -A)" && wc -c /tmp/sb.js
            curl -sSf https://registry.npmjs.org/@supabase/supabase-js/-/supabase-js-2.45.4.tgz -o /tmp/sb.tgz && \
              tar xzf /tmp/sb.tgz -C /tmp package/dist/umd/supabase.min.js && \
              (cmp /tmp/sb.js /tmp/package/dist/umd/supabase.min.js && echo "jsDelivr file == npm tarball file")
            for f in public-legal notification-transport-adapter radius-control test-onboarding; do
              echo "## deno check $f"; deno check supabase/functions/$f/index.ts 2>&1 | tail -40
            done
            echo "## deno tests"
            deno test supabase/functions/radius-control/protocol_test.ts 2>&1 | tail -40
            deno test supabase/functions/notification-transport-adapter/reveal_test.ts 2>&1 | tail -40
            deno run --allow-env supabase/functions/notification-transport-adapter/test_crypto.ts 2>&1 | tail -40
            for s in verify_netyemen_core_foundation verify_netyemen_commerce_v1 scan_netyemen_secrets scan_netyemen_card_secrets scan_netyemen_financial_invariants scan_netyemen_fcm_credentials scan_waselnet_release_readiness; do
              echo "## pwsh $s"; pwsh -NoProfile -File scripts/$s.ps1 2>&1 | tail -45; echo "exit=$?"
            done
            echo "## radius image + e2e"
            docker build -q -t wasel-radius-ci infra/radius 2>&1 | tail -20
            docker run --rm --entrypoint freeradius -e WASEL_CONTROL_URL=https://radius-control.example.test -e WASEL_RADIUS_INTERNAL_KEY=TEST_ONLY_CI_INTERNAL_KEY_32_BYTES -e WASEL_RADIUS_SHARED_SECRET=TEST_ONLY_CI_RADIUS_SECRET_32_BYTES -e WASEL_NAS_NETWORK=192.0.2.0/24 wasel-radius-ci -XC 2>&1 | tail -25
            sh infra/radius/test/run-radius-e2e.sh 2>&1 | tail -60
          } > /tmp/scripts.txt || true
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 /tmp/scripts.txt > /tmp/body.txt
          jq -Rs '{body: ("```\n" + . + "\n```")}' /tmp/body.txt > /tmp/payload.json
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input /tmp/payload.json > /dev/null
