name: NetYemen Supabase Core CI

on:
  push:
    branches:
      - 'antigravity/*'
      - 'kimi/*'
      - 'codex/*'
  pull_request:
    branches:
      - 'main'
      - 'antigravity/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-core-ci:
    name: Supabase Local Authorization & Verification Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Non-Empty Test and Document Artifacts
        run: |
          set -e
          echo "Verifying test and governance file sizes..."
          for file in \
            supabase/tests/001_core_schema_contract.sql \
            supabase/tests/002_core_authorization_positive.sql \
            supabase/tests/003_core_authorization_negative.sql \
            supabase/tests/004_core_invariants.sql \
            supabase/verification/018_account_deletion_production_preflight.sql \
            supabase/verification/018_account_deletion_production_postverify.sql \
            docs/NETYEMEN-CORE-BACKEND-FOUNDATION-01-REPORT.md \
            docs/NETYEMEN-CORE-BACKEND-MIGRATION-MANIFEST-01.md \
            docs/adr/ADR-002-ROLE-AND-RLS-FOUNDATION.md \
            docs/adr/ADR-003-NETWORK-MEMBERSHIP-AND-SSID-ALIASES.md \
            docs/adr/ADR-004-IMMUTABLE-AUDIT-FOUNDATION.md; do
            if [ ! -s "$file" ]; then
              echo "CRITICAL: Required file $file is missing or 0 bytes!"
              exit 1
            fi
            echo "[OK] $file (bytes: $(stat -c%s "$file"))"
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Public Legal Edge Function
        run: deno check supabase/functions/public-legal/index.ts

      - name: Disable Analytics in Local Supabase Config
        run: |
          if ! grep -q "\[analytics\]" supabase/config.toml; then
            echo -e "\n[analytics]\nenabled = false" >> supabase/config.toml
          fi

      - name: Start Disposable Local Supabase Stack
        run: |
          npx --yes supabase@2.109.1 stop --no-backup || true
          npx --yes supabase@2.109.1 start

      - name: Apply Migrations via Local Database Reset
        run: |
          npx --yes supabase@2.109.1 db reset --no-seed

      - name: Run Full SQL Contract and E2E Suite (001-018)
        run: |
          set -euo pipefail
          for test_file in supabase/tests/{001..018}_*.sql; do
            echo "Running $test_file"
            PGPASSWORD=postgres psql \
              "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f "$test_file"
          done

      - name: Verify Account Deletion Post-Migration Contract
        run: |
          PGPASSWORD=postgres psql \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/verification/018_account_deletion_production_postverify.sql

      - name: Execute PowerShell Static Verification Script
        shell: pwsh
        run: |
          ./scripts/verify_netyemen_core_foundation.ps1
          ./scripts/verify_netyemen_commerce_v1.ps1
          ./scripts/verify_netyemen_v1_pilot.ps1
          ./scripts/scan_netyemen_secrets.ps1
          ./scripts/scan_netyemen_card_secrets.ps1
          ./scripts/scan_netyemen_financial_invariants.ps1
          ./scripts/scan_netyemen_fcm_credentials.ps1

      - name: Cleanup Local Supabase Stack
        if: always()
        run: |
          npx --yes supabase@2.109.1 stop --no-backup
